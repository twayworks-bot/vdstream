<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="base-prefix" content="{{ base_prefix }}">
    <title>{% block title %}VDSTREAM - 720p 트랜스코딩 & 스트리밍 플랫폼{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ base_prefix }}/static/css/style.css">
    <!-- Hls.js for Instant Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark-subtle border-bottom border-secondary-subtle sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary" href="{{ base_prefix }}/dashboard">
                <i class="bi bi-play-circle-fill fs-3"></i>
                <span>VDSTREAM</span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle fs-7">720p HLS</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto align-items-center gap-3">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ base_prefix }}/dashboard"><i class="bi bi-grid-fill me-1"></i>대시보드</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ base_prefix }}/docs" target="_blank"><i class="bi bi-code-slash me-1"></i>Swagger API</a>
                    </li>
                    <li class="nav-item">
                        <span class="badge bg-secondary-subtle text-secondary-emphasis p-2 border">
                            <i class="bi bi-shield-lock-fill me-1"></i>보관주기: {{ settings.RETENTION_DAYS }}일
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Dashboard JS -->
    <script src="{{ base_prefix }}/static/js/dashboard.js"></script>
</body>
</html>
